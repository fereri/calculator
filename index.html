<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="javascript.js" defer></script>
</head>
<body>
    <!--This is the calculator-body -->
    <div class="calculator-body">
        <!--This holds the display at the top to show entered numbers and result-->
        <div class="result"></div>
        <!--This will hold the buttons for the numbers, operators, equal and clear button.-->
        <div class="calculator-buttons">
            <!--This will hold 7,8,9 and /-->
            <div class="first-section">
                <button class="seven">7</button>
                <button class="eight">8</button>
                <button class="nine">9</button>
                <button class="divide">/</button>
            </div>

            <!--This will hold 4,5,6 and *-->
            <div class="second-section">
                <button class="four">4</button>
                <button class="five">5</button>
                <button class="six">6</button>
                <button class="multiply">*</button>
            </div>

            <!--This will hold 1,2,3 and - -->
            <div class="third-section">
                <button class="one">1</button>
                <button class="two">2</button>
                <button class="three">3</button>
                <button class="minus">-</button>
            </div>

            <!--This will hold 0, =, and + aswell as .-->
            <div class="fourth-section">
                <button class="zero">0</button>
                <button class="decimal">.</button>
                <button class="equal">=</button>
                <button class="plus">+</button>
            </div>
        </div>
    </div>
</body>
</html>
